<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ERA GROUP ACCOUNTING – Intelligent Business & Financial Management System</title>
  <style>
    /* =========================================================================
       ERA GROUP ACCOUNTING – 100% SELF-CONTAINED GLOSSY GLASSMORPHISM THEME
       Zero external CSS / Font / Icon CDN dependencies (Offline & Tablet Safe)
       ========================================================================= */
    :root {
      --navy-950: #040d1d;
      --navy-900: #07162F;
      --navy-800: #0B1F40;
      --navy-700: #112C59;
      --electric: #087BFF;
      --cyan: #00D4FF;
      --green: #00D69A;
      --purple: #8B5CF6;
      --red: #FF5268;
      --amber: #FBBF24;
      --white: #FFFFFF;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
      --border-glass: rgba(255, 255, 255, 0.11);
      --border-cyan: rgba(0, 212, 255, 0.35);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --shadow-card: 0 12px 32px rgba(2, 8, 22, 0.55);
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: var(--font-sans);
      background-color: var(--navy-900);
      background-image:
        radial-gradient(circle at 12% 10%, rgba(8, 123, 255, 0.22), transparent 36%),
        radial-gradient(circle at 88% 12%, rgba(0, 212, 255, 0.15), transparent 34%),
        radial-gradient(circle at 55% 92%, rgba(139, 92, 246, 0.14), transparent 40%),
        linear-gradient(160deg, #051024 0%, #07162F 48%, #0B1F40 100%);
      color: var(--text-main);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: rgba(7, 22, 47, 0.6); }
    ::-webkit-scrollbar-thumb { background: rgba(8, 123, 255, 0.45); border-radius: 99px; }

    /* App Layout Shell */
    .app-shell {
      display: flex;
      min-height: 100vh;
      width: 100%;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      flex-shrink: 0;
      background: linear-gradient(180deg, rgba(6, 19, 42, 0.96) 0%, rgba(11, 31, 64, 0.94) 100%);
      border-right: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      z-index: 40;
      transition: transform 0.28s ease;
    }

    .brand-box {
      padding: 18px 18px 14px;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--electric), var(--cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
      flex-shrink: 0;
    }

    .brand-title {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.2px;
      color: var(--white);
      line-height: 1.2;
    }

    .brand-badge {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 10px;
      font-weight: 700;
      color: var(--cyan);
      background: rgba(8, 123, 255, 0.2);
      border: 1px solid rgba(0, 212, 255, 0.35);
    }

    .nav-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 12px 10px 20px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-item {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 10px 13px;
      border-radius: var(--radius-md);
      border: 1px solid transparent;
      background: transparent;
      color: #CBD5E1;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.18s ease;
    }

    .nav-item:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--white);
    }

    .nav-item.active {
      background: linear-gradient(90deg, var(--electric) 0%, rgba(0, 212, 255, 0.85) 100%);
      color: var(--white);
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(8, 123, 255, 0.42);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .nav-item svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    /* Main Content Wrapper */
    .main-area {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    /* Top Header Bar */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(7, 22, 47, 0.84);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border-glass);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .mobile-menu-btn {
      display: none;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-glass);
      color: var(--white);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
    }

    .company-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(11, 31, 64, 0.92);
      border: 1px solid var(--border-cyan);
      padding: 6px 12px;
      border-radius: 12px;
      box-shadow: 0 0 15px rgba(0, 212, 255, 0.14);
    }

    .company-pill select {
      background: transparent;
      border: none;
      color: var(--white);
      font-weight: 700;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .company-pill select option {
      background: var(--navy-800);
      color: var(--white);
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-glass);
      border-radius: 11px;
      padding: 7px 12px;
      min-width: 210px;
    }

    .search-box input {
      background: transparent;
      border: none;
      color: var(--white);
      font-size: 12.5px;
      outline: none;
      width: 100%;
    }

    .autobackup-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 7px 12px;
      border-radius: 11px;
      background: rgba(0, 214, 154, 0.13);
      border: 1px solid rgba(0, 214, 154, 0.4);
      color: var(--green);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .autobackup-pill:hover {
      background: rgba(0, 214, 154, 0.22);
      box-shadow: 0 0 14px rgba(0, 214, 154, 0.25);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }

    .icon-btn {
      position: relative;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--border-glass);
      color: var(--white);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .icon-btn:hover {
      border-color: var(--cyan);
      background: rgba(8, 123, 255, 0.2);
    }

    .notif-badge {
      position: absolute;
      top: -4px;
      right: -4px;
      background: var(--red);
      color: var(--white);
      font-size: 10px;
      font-weight: 800;
      padding: 1px 5px;
      border-radius: 99px;
    }

    .profile-chip {
      display: flex;
      align-items: center;
      gap: 9px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-glass);
      padding: 5px 11px 5px 6px;
      border-radius: 12px;
    }

    .avatar-circle {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--electric), var(--purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 12px;
      color: var(--white);
    }

    /* Page Container */
    .content-body {
      padding: 20px;
      max-width: 1480px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Glossy Glass Card */
    .glass-card {
      background: linear-gradient(145deg, rgba(14, 38, 78, 0.78) 0%, rgba(7, 22, 47, 0.88) 100%);
      border: 1px solid var(--border-glass);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: var(--radius-lg);
      padding: 18px;
      box-shadow: var(--shadow-card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    /* Welcome Hero Banner */
    .hero-banner {
      background: linear-gradient(110deg, rgba(8, 123, 255, 0.45) 0%, rgba(11, 31, 64, 0.92) 55%, rgba(0, 212, 255, 0.25) 100%);
      border: 1px solid rgba(0, 212, 255, 0.35);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 10px 30px rgba(8, 123, 255, 0.22);
    }

    .hero-title {
      font-size: 21px;
      font-weight: 800;
      color: var(--white);
      margin-bottom: 4px;
    }

    .hero-sub {
      font-size: 13px;
      color: #CBD5E1;
    }

    .period-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(7, 22, 47, 0.85);
      border: 1px solid var(--border-cyan);
      padding: 9px 14px;
      border-radius: 13px;
    }

    .period-box select, .period-box input {
      background: transparent;
      border: none;
      color: var(--white);
      font-weight: 700;
      font-size: 13px;
      outline: none;
    }

    .period-box select option { background: var(--navy-800); }

    /* KPI Grid */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .kpi-card {
      border-radius: var(--radius-lg);
      padding: 18px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: var(--shadow-card);
      transition: transform 0.2s ease;
    }

    .kpi-card:hover { transform: translateY(-2px); }

    .kpi-green { background: linear-gradient(145deg, rgba(0, 214, 154, 0.24) 0%, rgba(7, 22, 47, 0.92) 70%); border-color: rgba(0, 214, 154, 0.35); }
    .kpi-red { background: linear-gradient(145deg, rgba(255, 82, 104, 0.24) 0%, rgba(7, 22, 47, 0.92) 70%); border-color: rgba(255, 82, 104, 0.35); }
    .kpi-blue { background: linear-gradient(145deg, rgba(8, 123, 255, 0.3) 0%, rgba(7, 22, 47, 0.92) 70%); border-color: rgba(0, 212, 255, 0.38); }
    .kpi-purple { background: linear-gradient(145deg, rgba(139, 92, 246, 0.28) 0%, rgba(7, 22, 47, 0.92) 70%); border-color: rgba(139, 92, 246, 0.38); }

    .kpi-top {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .kpi-icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .kpi-label { font-size: 12.5px; color: #CBD5E1; font-weight: 500; }
    .kpi-value { font-size: 20px; font-weight: 800; color: var(--white); font-family: var(--font-mono); margin-top: 3px; }
    .kpi-foot { font-size: 11.5px; margin-top: 8px; display: flex; align-items: center; gap: 6px; color: var(--text-muted); }

    /* Secondary Summary Strip */
    .mini-stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .mini-stat {
      background: rgba(7, 22, 47, 0.72);
      border: 1px solid var(--border-glass);
      border-radius: 13px;
      padding: 12px 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Dashboard Middle Grid */
    .dash-mid-grid {
      display: grid;
      grid-template-columns: 1.55fr 1fr 0.95fr;
      gap: 16px;
    }

    /* Dashboard Bottom Grid */
    .dash-bot-grid {
      display: grid;
      grid-template-columns: 1.65fr 1fr;
      gap: 16px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 9px 15px;
      border-radius: 11px;
      font-size: 12.5px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.18s ease;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--electric) 0%, #00A3FF 100%);
      color: var(--white);
      box-shadow: 0 4px 16px rgba(8, 123, 255, 0.42);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

    .btn-emerald {
      background: linear-gradient(135deg, #00B884 0%, var(--green) 100%);
      color: #031B14;
      box-shadow: 0 4px 16px rgba(0, 214, 154, 0.35);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--border-glass);
      color: var(--white);
    }

    .btn-secondary:hover { background: rgba(255, 255, 255, 0.14); border-color: var(--cyan); }

    .btn-danger {
      background: rgba(255, 82, 104, 0.18);
      border-color: rgba(255, 82, 104, 0.45);
      color: var(--red);
    }

    .btn-danger:hover { background: rgba(255, 82, 104, 0.3); }

    .btn-sm { padding: 6px 11px; font-size: 11.5px; border-radius: 9px; }

    /* Module Tile Grid */
    .module-tiles {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .mod-tile {
      background: rgba(11, 31, 64, 0.72);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 13px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
      cursor: pointer;
      color: var(--text-main);
      font-size: 11.5px;
      font-weight: 600;
      transition: all 0.18s;
    }

    .mod-tile:hover {
      border-color: var(--cyan);
      background: rgba(8, 123, 255, 0.2);
      transform: translateY(-2px);
    }

    .mod-tile-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      background: linear-gradient(135deg, rgba(8, 123, 255, 0.28), rgba(0, 212, 255, 0.18));
      border: 1px solid rgba(0, 212, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--cyan);
    }

    /* Tables */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      border-radius: 12px;
      border: 1px solid var(--border-glass);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      text-align: left;
    }

    th {
      background: rgba(4, 13, 29, 0.75);
      color: var(--text-muted);
      font-weight: 700;
      text-transform: uppercase;
      font-size: 11px;
      letter-spacing: 0.4px;
      padding: 11px 13px;
      border-bottom: 1px solid var(--border-glass);
    }

    td {
      padding: 11px 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      color: var(--text-main);
    }

    tr:hover td { background: rgba(255, 255, 255, 0.03); }

    .text-right { text-align: right; }
    .text-center { text-align: center; }
    .font-mono { font-family: var(--font-mono); }
    .text-cyan { color: var(--cyan); }
    .text-green { color: var(--green); }
    .text-red { color: var(--red); }
    .text-amber { color: var(--amber); }
    .text-purple { color: var(--purple); }
    .text-muted { color: var(--text-muted); }

    /* Pills & Badges */
    .badge {
      display: inline-block;
      padding: 3px 9px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-green { background: rgba(0, 214, 154, 0.18); color: var(--green); }
    .badge-red { background: rgba(255, 82, 104, 0.18); color: var(--red); }
    .badge-blue { background: rgba(8, 123, 255, 0.22); color: var(--cyan); }
    .badge-amber { background: rgba(251, 191, 36, 0.18); color: var(--amber); }

    /* Sub-tabs */
    .tab-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-glass);
    }

    .tab-btn {
      padding: 7px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-glass);
      background: rgba(255, 255, 255, 0.05);
      color: #CBD5E1;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--electric);
      color: var(--white);
      border-color: var(--cyan);
      box-shadow: 0 4px 14px rgba(8, 123, 255, 0.4);
    }

    /* Forms & Inputs */
    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 12px;
      font-weight: 600;
      color: #CBD5E1;
    }

    input[type="text"], input[type="number"], input[type="date"], select, textarea {
      background: rgba(4, 13, 29, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 10px;
      padding: 9px 12px;
      color: var(--white);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      width: 100%;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.16);
    }

    /* Modal System */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(3, 9, 22, 0.78);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-overlay.open { display: flex; }

    .modal-box {
      width: 100%;
      max-width: 640px;
      max-height: 90vh;
      overflow-y: auto;
      background: linear-gradient(155deg, #0D254C 0%, #061329 100%);
      border: 1px solid var(--border-cyan);
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border-glass);
    }

    /* Toast Notification */
    .toast-stack {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 150;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 360px;
    }

    .toast-item {
      background: rgba(7, 22, 47, 0.96);
      border: 1px solid var(--cyan);
      color: var(--white);
      padding: 12px 15px;
      border-radius: 13px;
      font-size: 12.5px;
      font-weight: 600;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Responsive Breakpoints (Tablet & Mobile) */
    @media (max-width: 1180px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .mini-stats-grid { grid-template-columns: repeat(2, 1fr); }
      .dash-mid-grid { grid-template-columns: 1fr; }
      .dash-bot-grid { grid-template-columns: 1fr; }
      .module-tiles { grid-template-columns: repeat(4, 1fr); }
    }

    @media (max-width: 860px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        transform: translateX(-100%);
      }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu-btn { display: inline-flex; }
      .search-box { display: none; }
    }

    @media (max-width: 560px) {
      .kpi-grid { grid-template-columns: 1fr; }
      .mini-stats-grid { grid-template-columns: 1fr; }
      .module-tiles { grid-template-columns: repeat(3, 1fr); }
      .form-grid { grid-template-columns: 1fr; }
    }

    @media print {
      .sidebar, .topbar, .no-print { display: none !important; }
      body, .glass-card { background: #fff !important; color: #000 !important; box-shadow: none !important; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- LEFT SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <div class="brand-box">
        <div class="brand-logo">

    function loadDatabase() {

    function saveDatabase(backupReason = null, forceDownload = false) {

        if (backupReason) {
          recordAutoBackupSnapshot(backupReason, forceDownload);

      } catch (err) {
        console.warn('LocalStorage save warning:', err);
      }
    }

    function recordAutoBackupSnapshot(reason, forceDownload = false) {
      try {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const stamp = `${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
        const fileStamp = `${now.getFullYear()}${pad(now.getMonth() + 1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}`;

        DB.autoBackup.lastSnapshotTime = stamp;

        if (DB.autoBackup.enabled) {
          const metrics = computeFinancials();
          const slots = getBackupSlots();
          slots.unshift({
            id: 'SNAP-' + now.getTime(),
            timestamp: stamp,
            reason,
            companyCount: DB.companies.length,
            journalCount: DB.journals.length,
            totalAssets: metrics.totalAssets,
            snapshotData: JSON.parse(JSON.stringify(DB))
          });
          if (slots.length > 10) slots.length = 10;
          localStorage.setItem(BACKUP_SLOTS_KEY, JSON.stringify(slots));

          const threshold = Number(DB.autoBackup.autoDownloadEvery) || 0;
          if (threshold > 0) {
            DB.autoBackup.changesCounter = (DB.autoBackup.changesCounter || 0) + 1;
            if (DB.autoBackup.changesCounter >= threshold || forceDownload) {
              DB.autoBackup.changesCounter = 0;
              downloadBackupJSON(`ERA-GROUP-AUTOBACKUP-${fileStamp}.json`);
            }
          } else if (forceDownload) {
            downloadBackupJSON(`ERA-GROUP-BACKUP-${fileStamp}.json`);
          }
        }
        updateAutoBackupIndicator();
      } catch (err) {
        console.warn('Snapshot error:', err);
      }
    }

    function downloadBackupJSON(filename) {
      try {
        const bundle = {
          application: 'ERA GROUP ACCOUNTING – ERP Accounting Suite',
          exportedAt: new Date().toISOString(),
          database: DB
        };
        const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast(`File backup ${filename} berhasil diunduh!`);
      } catch (err) {
        showToast('Gagal mengunduh file backup JSON.', 'error');
      }
    }

    /* =========================================================================
       3. DOUBLE-ENTRY ACCOUNTING ENGINE & FINANCIAL CALCULATOR
       ========================================================================= */
    function formatIDR(num) {
      const val = Number(num) || 0;
      const abs = Math.abs(Math.round(val)).toLocaleString('id-ID');
      return val < 0 ? `-Rp ${abs}` : `Rp ${abs}`;
    }

    function todayISO() {
      return new Date().toISOString().slice(0, 10);
    }

    function getFilteredJournals() {
      return DB.journals.filter(j => {
        if (DB.activeCompanyId !== 'ALL' && j.companyId !== DB.activeCompanyId) return false;
        if (DB.activePeriod === 'Custom Date') {
          if (DB.customStartDate && j.date < DB.customStartDate) return false;
          if (DB.customEndDate && j.date > DB.customEndDate) return false;
        }
        return true;
      });
    }

    function getAccountBalance(code, journalsList = null) {
      const acc = DB.coa.find(a => a.code === code);
      if (!acc) return 0;
      const list = journalsList || getFilteredJournals();
      let debit = 0;
      let credit = 0;
      list.forEach(j => {
        j.lines.forEach(l => {
          if (l.accountCode === code) {
            debit += Number(l.debit) || 0;
            credit += Number(l.credit) || 0;
          }
        });
      });
      return acc.normal === 'Debit' ? (debit - credit) : (credit - debit);
    }

    function computeFinancials() {
      const list = getFilteredJournals();
      const cash = getAccountBalance('1-1010', list);
      const bankBCA = getAccountBalance('1-1020', list);
      const bankMandiri = getAccountBalance('1-1030', list);
      const totalCashBank = cash + bankBCA + bankMandiri;

      const ar = getAccountBalance('1-1100', list);
      const inventoryVal = getAccountBalance('1-1200', list);
      const ppnIn = getAccountBalance('1-1300', list);
      const fixedAssets = getAccountBalance('1-2100', list);
      const accumDep = getAccountBalance('1-2190', list);
      const totalAssets = totalCashBank + ar + inventoryVal + ppnIn + (fixedAssets - accumDep);

      const ap = getAccountBalance('2-1100', list);
      const taxPayable = getAccountBalance('2-1200', list);
      const payrollPayable = getAccountBalance('2-1300', list);
      const totalLiabilities = ap + taxPayable + payrollPayable;

      const rev1 = getAccountBalance('4-1000', list);
      const rev2 = getAccountBalance('4-2000', list);
      const totalRevenue = rev1 + rev2;

      const cogs = getAccountBalance('5-1000', list);
      const salExp = getAccountBalance('6-1000', list);
      const opExp = getAccountBalance('6-2000', list);
      const depExp = getAccountBalance('6-3000', list);
      const totalExpense = cogs + salExp + opExp + depExp;

      const netProfit = totalRevenue - totalExpense;
      const equity = getAccountBalance('3-1000', list) + getAccountBalance('3-2000', list) + netProfit;

      return {
        cash,
        bankTotal: bankBCA + bankMandiri,
        totalCashBank,
        ar,
        ap,
        inventoryVal,
        totalAssets,
        totalLiabilities,
        equity,
        totalRevenue,
        totalExpense,
        netProfit,
        cogs,
        salExp,
        opExp,
        depExp
      };
    }

    function postJournalEntry({ companyId, date, ref, description, module, lines }) {
      const cleanLines = lines.filter(l => (Number(l.debit) || 0) > 0 || (Number(l.credit) || 0) > 0);
      const sumDebit = cleanLines.reduce((s, l) => s + (Number(l.debit) || 0), 0);
      const sumCredit = cleanLines.reduce((s, l) => s + (Number(l.credit) || 0), 0);

      if (cleanLines.length < 2 || Math.abs(sumDebit - sumCredit) > 0.01 || sumDebit <= 0) {
        throw new Error(`Jurnal tidak seimbang! Total Debit (${formatIDR(sumDebit)}) ≠ Total Kredit (${formatIDR(sumCredit)}).`);
      }

      const id = 'JV-' + String(DB.journals.length + 1).padStart(4, '0');
      const entry = {
        id,
        companyId: companyId === 'ALL' ? 'EBF' : companyId,
        date: date || todayISO(),
        ref: ref || id,
        description,
        module: module || 'Accounting',
        lines: cleanLines.map(l => ({
          accountCode: l.accountCode,
          debit: Number(l.debit) || 0,
          credit: Number(l.credit) || 0
        }))
      };

      DB.journals.unshift(entry);
      DB.activities.unshift({
        id: 'ACT-' + Date.now(),

    function renderSVGPerformanceChart(m) {
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agt', 'Sep', 'Okt', 'Nov'];
      const currentVal = chartMetric === 'rev' ? m.totalRevenue : (chartMetric === 'exp' ? m.totalExpense : m.netProfit);
      const vals = months.map((_, idx) => idx === 10 ? Math.max(0, currentVal) : 0);
      const maxVal = Math.max(...vals, 1000000);
      const w = 520, h = 165, padL = 16, padR = 16, padT = 18, padB = 26;
      const plotW = w - padL - padR;
      const plotH = h - padT - padB;

      const pts = vals.map((v, i) => {
        const x = padL + (i / (months.length - 1)) * plotW;
        const y = padT + plotH - (v / maxVal) * plotH;
        return { x, y, v, label: months[i] };
      });

      const polyline = pts.map(p => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
      const area = `${pts[0].x},${padT + plotH} ${polyline} ${pts[pts.length - 1].x},${padT + plotH}`;
      const strokeColor = chartMetric === 'exp' ? '#FF5268' : (chartMetric === 'profit' ? '#00D69A' : '#00D4FF');

      return `
        <svg viewBox="0 0 ${w} ${h}" style="width:100%;height:175px;display:block;">
          <defs>
            <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${strokeColor}" stop-opacity="0.38"/>
              <stop offset="100%" stop-color="${strokeColor}" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <line x1="${padL}" y1="${padT + plotH}" x2="${w - padR}" y2="${padT + plotH}" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
          <line x1="${padL}" y1="${padT + plotH * 0.5}" x2="${w - padR}" y2="${padT + plotH * 0.5}" stroke="rgba(255,255,255,0.07)" stroke-dasharray="4 4"/>
          <polygon points="${area}" fill="url(#chartGrad)"/>
          <polyline fill="none" stroke="${strokeColor}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${polyline}"/>
          ${pts.map(p => `
            <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="4" fill="#07162F" stroke="${strokeColor}" stroke-width="2.2"/>
            <text x="${p.x.toFixed(1)}" y="${h - 7}" text-anchor="middle" fill="#94A3B8" font-size="10">${p.label}</text>
          `).join('')}
        </svg>
      `;
    }

    function renderDonutCashFlow(m) {
      const total = m.totalCashBank;
      const r = 46;
      const c = 2 * Math.PI * r;
      const cashPct = total > 0 ? (m.cash / total) : 0;
      const bankPct = total > 0 ? (m.bankTotal / total) : 0;
      const cashLen = cashPct * c;
      const bankLen = bankPct * c;

      return `
        <div style="display:flex;align-items:center;justify-content:center;padding:8px 0;">
          <svg width="136" height="136" viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="${r}" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="13"/>
            ${total > 0 ? `
              <circle cx="60" cy="60" r="${r}" fill="none" stroke="#00D4FF" stroke-width="13"
                stroke-dasharray="${cashLen} ${c}" transform="rotate(-90 60 60)"/>
              <circle cx="60" cy="60" r="${r}" fill="none" stroke="#8B5CF6" stroke-width="13"
                stroke-dasharray="${bankLen} ${c}" stroke-dashoffset="${-cashLen}" transform="rotate(-90 60 60)"/>
            ` : ''}
            <text x="60" y="57" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800">${total > 0 ? 'Likuiditas' : 'Rp 0'}</text>
            <text x="60" y="71" text-anchor="middle" fill="#94A3B8" font-size="9">${total > 0 ? 'Aktif' : 'Saldo Awal'}</text>
          </svg>
        </div>
      `;
    }

                  </div>
                  <div class="table-wrap">
                    <table>
                      <thead>
                        <tr><th>Akun</th><th class="text-right">Debit</th><th class="text-right">Kredit</th></tr>
                      </thead>
                      <tbody>
                        ${j.lines.map(l => {
                          const coaObj = DB.coa.find(c => c.code === l.accountCode);
                          return `
                            <tr>
                              <td><span class="font-mono text-cyan">${l.accountCode}</span> - ${coaObj ? coaObj.name : ''}</td>
                              <td class="text-right font-mono text-green">${l.debit > 0 ? formatIDR(l.debit) : '-'}</td>
                              <td class="text-right font-mono text-amber">${l.credit > 0 ? formatIDR(l.credit) : '-'}</td>
                            </tr>
                          `;
                        }).join('')}
                      </tbody>
                    </table>
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        `;
      } else if (currentAccTab === 'trial') {
        let totD = 0, totC = 0;
        const rows = DB.coa.map(acc => {
          const bal = getAccountBalance(acc.code, journals);
          const d = acc.normal === 'Debit' ? Math.max(0, bal) : Math.max(0, -bal);
          const c = acc.normal === 'Kredit' ? Math.max(0, bal) : Math.max(0, -bal);
          totD += d; totC += c;
          return { acc, d, c };
        });
        tabBody = `
          <h3 style="font-size:15px;font-weight:800;margin-bottom:12px;">Neraca Saldo (Trial Balance)</h3>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Kode</th><th>Nama Akun</th><th class="text-right">Debit</th><th class="text-right">Kredit</th></tr></thead>
              <tbody>
                ${rows.map(r => `
                  <tr>
                    <td class="font-mono text-cyan">${r.acc.code}</td>
                    <td>${r.acc.name}</td>
                    <td class="text-right font-mono">${formatIDR(r.d)}</td>
                    <td class="text-right font-mono">${formatIDR(r.c)}</td>

                <tr style="background:rgba(8,123,255,0.16);font-weight:800;">
                  <td colspan="2">TOTAL NERACA SALDO (${Math.abs(totD - totC) < 1 ? 'SEIMBANG ✓' : 'SELISIH'})</td>

                  <td class="text-right font-mono text-cyan">${formatIDR(totC)}</td>

                <tr><td>Beban Penyusutan Aset Tetap (6-3000)</td><td class="text-right font-mono">${formatIDR(m.depExp)}</td></tr>
                <tr style="background:rgba(8,123,255,0.22);font-weight:800;font-size:14px;">
                  <td>LABA / (RUGI) BERSIH PERIODE BERJALAN</td>
                  <td class="text-right font-mono text-cyan">${formatIDR(m.netProfit)}</td>

          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">

                <tr><td>Kas & Setara Kas (Kas, Bank BCA, Bank Mandiri)</td><td class="text-right font-mono">${formatIDR(m.totalCashBank)}</td></tr>
                <tr><td>Piutang Usaha (Accounts Receivable)</td><td class="text-right font-mono">${formatIDR(m.ar)}</td></tr>
                <tr><td>Persediaan Barang & Ternak</td><td class="text-right font-mono">${formatIDR(m.inventoryVal)}</td></tr>
                <tr><td>Aset Tetap (Neto setelah Akum. Penyusutan)</td><td class="text-right font-mono">${formatIDR(m.totalAssets - m.totalCashBank - m.ar - m.inventoryVal)}</td></tr>

      inv.status = 'Paid';
      postJournalEntry({
        companyId: inv.companyId,
        date: todayISO(),
        ref: inv.id,
        description: `Pelunasan Piutang ${inv.id} - ${inv.customer}`,
        module: 'Sales',
        lines: [
          { accountCode: '1-1020', debit: inv.total, credit: 0 },

    function runDepreciation() {
      const list = DB.activeCompanyId === 'ALL' ? DB.assets : DB.assets.filter(a => a.companyId === DB.activeCompanyId);
      if (!list.length) return;
      let totalDep = 0;
      list.forEach(a => {
        const monthly = Math.round(a.cost / (Math.max(1, a.years) * 12));
        a.accumDep += monthly;
        totalDep += monthly;
      });
      postJournalEntry({
        companyId: DB.activeCompanyId === 'ALL' ? 'EBF' : DB.activeCompanyId,
        date: todayISO(),
        ref: 'DEP-BULANAN',
        description: 'Penyusutan Aset Tetap Bulanan',
        module: 'Assets',
        lines: [
          { accountCode: '6-3000', debit: totalDep, credit: 0 },
          { accountCode: '1-2190', debit: 0, credit: totalDep }
        ]
      });
      renderView();
      showToast(`Penyusutan ${formatIDR(totalDep)} berhasil diposting ke jurnal!`);
    }

    function runPayrollPosting() {
      const list = DB.activeCompanyId === 'ALL' ? DB.employees : DB.employees.filter(e => e.companyId === DB.activeCompanyId);

      const totalGross = list.reduce((s, e) => s + e.baseSalary + e.allowance, 0);
      postJournalEntry({
        companyId: DB.activeCompanyId === 'ALL' ? 'EMA' : DB.activeCompanyId,
        date: todayISO(),
        ref: 'PAYROLL',
        description: `Pembayaran Gaji Karyawan (${list.length} Orang)`,
        module: 'Payroll',
        lines: [
          { accountCode: '6-1000', debit: totalGross, credit: 0 },
          { accountCode: '1-1020', debit: 0, credit: totalGross }
        ]
      });
      renderView();
      showToast(`Payroll ${formatIDR(totalGross)} berhasil diposting!`);
    }

    function renderTaxModule() {

    function restoreSnapshot(snapId) {
      const slots = getBackupSlots();
      const found = slots.find(s => s.id === snapId);
      if (!found || !found.snapshotData) {
        showToast('Snapshot tidak ditemukan.', 'error');
        return;
      }
      DB = JSON.parse(JSON.stringify(found.snapshotData));
      saveDatabase();
      renderCompanySelect();
      renderView();
      closeModal();
      showToast(`Data berhasil dipulihkan ke titik ${found.timestamp}!`);
    }

    function importBackupJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const parsed = JSON.parse(ev.target.result);
          const candidate = parsed.database || parsed;
          if (!candidate || !Array.isArray(candidate.coa)) throw new Error('Invalid');
          DB = candidate;
          saveDatabase('Restore dari File JSON');
          renderCompanySelect();
          renderView();
          closeModal();
          showToast(`Database dipulihkan dari ${file.name}!`);
        } catch (err) {
          showToast('File JSON tidak valid!', 'error');
        }
      };
      reader.readAsText(file);
    }

    function submitOpeningBalance(e) {
      e.preventDefault();
      const companyId = document.getElementById('ob-comp').value;
      const date = document.getElementById('ob-date').value;
      const cash = Number(document.getElementById('ob-cash').value) || 0;
      const bca = Number(document.getElementById('ob-bca').value) || 0;
      const mandiri = Number(document.getElementById('ob-mandiri').value) || 0;
      const ar = Number(document.getElementById('ob-ar').value) || 0;
      const inv = Number(document.getElementById('ob-inv').value) || 0;
      const asset = Number(document.getElementById('ob-asset').value) || 0;
      const total = cash + bca + mandiri + ar + inv + asset;

      if (total <= 0) {
        showToast('Isi minimal satu nominal saldo awal lebih dari Rp 0.', 'error');
        return;
      }

      const lines = [];
      if (cash > 0) lines.push({ accountCode: '1-1010', debit: cash, credit: 0 });
      if (bca > 0) lines.push({ accountCode: '1-1020', debit: bca, credit: 0 });
      if (mandiri > 0) lines.push({ accountCode: '1-1030', debit: mandiri, credit: 0 });
      if (ar > 0) lines.push({ accountCode: '1-1100', debit: ar, credit: 0 });
      if (inv > 0) lines.push({ accountCode: '1-1200', debit: inv, credit: 0 });
      if (asset > 0) lines.push({ accountCode: '1-2100', debit: asset, credit: 0 });
      lines.push({ accountCode: '3-1000', debit: 0, credit: total });

      postJournalEntry({
        companyId,
        date,
        ref: `OB-${companyId}`,
        description: `Saldo Awal Neraca - ${companyId}`,
        module: 'Accounting',
        lines
      });

      closeModal();
      renderView();
      showToast(`Saldo awal ${formatIDR(total)} berhasil disimpan & di-backup!`);
    }

    function submitNewSale(e) {
      e.preventDefault();
      const companyId = document.getElementById('sl-comp').value;
      const customer = document.getElementById('sl-cust').value.trim();
      const item = document.getElementById('sl-item').value.trim();
      const dpp = Number(document.getElementById('sl-amount').value) || 0;
      const withPpn = document.getElementById('sl-ppn').value === '1';
      const payAcc = document.getElementById('sl-pay').value;
      const ppnVal = withPpn ? Math.round(dpp * (DB.taxConfig.ppnRate / 100)) : 0;
      const total = dpp + ppnVal;
      const invId = 'INV-' + String(DB.salesInvoices.length + 1).padStart(4, '0');

      DB.salesInvoices.unshift({
        id: invId,
        companyId,
        date: todayISO(),
        customer,
        item,
        total,
        status: payAcc === '1-1100' ? 'Unpaid' : 'Paid'
      });

      const lines = [
        { accountCode: payAcc, debit: total, credit: 0 },
        { accountCode: '4-1000', debit: 0, credit: dpp }
      ];
      if (ppnVal > 0) lines.push({ accountCode: '2-1200', debit: 0, credit: ppnVal });

      postJournalEntry({
        companyId,
        date: todayISO(),
        ref: invId,
        description: `Penjualan ${invId} - ${customer} (${item})`,
        module: 'Sales',
        lines
      });

      closeModal();
      renderView();
      showToast(`Faktur ${invId} senilai ${formatIDR(total)} berhasil diposting!`);
    }

    function openAddBudgetModal() {
      openModal(`
        <div class="modal-head"><h3 style="font-size:16px;font-weight:800;">Tambah Anggaran Departemen</h3><button class="btn btn-sm btn-secondary" onclick="closeModal()">✕</button></div>
        <form onsubmit="event.preventDefault();DB.budgets.unshift({dept:document.getElementById('bg-d').value,amount:Number(document.getElementById('bg-a').value),actual:0});saveDatabase('Tambah Anggaran');closeModal();renderView();showToast('Anggaran ditambahkan!');" class="form-grid">
          <div class="form-group"><label>Departemen</label><input id="bg-d" required /></div>
          <div class="form-group"><label>Budget Bulanan (Rp)</label><input type="number" id="bg-a" required value="30000000" class="font-mono" /></div>
          <div class="form-group full" style="flex-direction:row;justify-content:flex-end;"><button type="submit" class="btn btn-primary">Simpan</button></div>
        </form>
      `);
    }

    function openAddDocModal() {
      openModal(`
        <div class="modal-head"><h3 style="font-size:16px;font-weight:800;">Catat Arsip Dokumen</h3><button class="btn btn-sm btn-secondary" onclick="closeModal()">✕</button></div>
        <form onsubmit="event.preventDefault();DB.documents.unshift({name:document.getElementById('dc-n').value,category:document.getElementById('dc-c').value,companyId:DB.activeCompanyId,date:todayISO()});saveDatabase('Tambah Dokumen');closeModal();renderView();showToast('Dokumen dicatat!');" class="form-grid">
          <div class="form-group full"><label>Nama Dokumen</label><input id="dc-n" required /></div>
          <div class="form-group full"><label>Kategori</label><input id="dc-c" required value="Kontrak & Legal" /></div>
          <div class="form-group full" style="flex-direction:row;justify-content:flex-end;"><button type="submit" class="btn btn-primary">Simpan</button></div>
        </form>
      `);
    }

    function openNotificationsModal() {
      openModal(`
        <div class="modal-head"><h3 style="font-size:16px;font-weight:800;">🔔 Notifikasi Sistem</h3><button class="btn btn-sm btn-secondary" onclick="closeModal()">✕</button></div>
        <div style="display:flex;flex-direction:column;gap:8px;font-size:12.5px;">
          ${DB.notifications.map(n => `
            <div style="padding:11px;border-radius:11px;background:rgba(4,13,29,0.7);border:1px solid var(--border-glass);">
              <div style="font-weight:700;color:#00D4FF;">${n.title}</div>
              <div style="color:#CBD5E1;margin-top:3px;">${n.desc}</div>
            </div>
          `).join('')}
        </div>
      `);
    }

    function openResetConfirmModal() {
      openModal(`
        <div class="modal-head"><h3 style="font-size:16px;font-weight:800;color:#FF5268;">⚠️ Reset Bersih ke Rp 0</h3><button class="btn btn-sm btn-secondary" onclick="closeModal()">✕</button></div>
        <p style="font-size:13px;color:#CBD5E1;margin-bottom:14px;">Seluruh transaksi dan saldo akan dikosongkan ke <strong>Rp 0</strong>. Snapshot Auto-Backup sebelumnya tetap aman tersimpan di browser.</p>
        <div style="display:flex;justify-content:flex-end;gap:8px;">
          <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
          <button class="btn btn-danger" onclick="resetAllToCleanSlate()">Ya, Kosongkan Data</button>
        </div>
      `);
    }

    function exportAllCSV() {
      const rows = [['Kode Akun', 'Nama Akun', 'Kategori', 'Saldo']];
      const journals = getFilteredJournals();
      DB.coa.forEach(a => {
        rows.push([a.code, `"${a.name}"`, a.category, getAccountBalance(a.code, journals)]);
      });
      const csv = rows.map(r => r.join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ERA-GROUP-LAPORAN-${todayISO()}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      showToast('Laporan keuangan berhasil diekspor ke CSV!');
    }

    function showToast(msg, type = 'success') {
      const stack = document.getElementById('toast-stack');
      const item = document.createElement('div');
      item.className = 'toast-item';
      item.style.borderColor = type === 'error' ? '#FF5268' : '#00D69A';
      item.innerHTML = `<span>${type === 'error' ? '⚠️' : '✅'}</span><span>${msg}</span>`;
      stack.appendChild(item);
      setTimeout(() => item.remove(), 3400);
    }

    /* =========================================================================
       10. MAIN VIEW ROUTER & BOOTSTRAP
       ========================================================================= */
    function renderView() {
      const vp = document.getElementById('app-viewport');
      if (!vp) return;
      try {
        switch (currentRoute) {
          case 'dashboard': vp.innerHTML = renderDashboard(); break;
          case 'accounting': vp.innerHTML = renderAccountingModule(); break;
          case 'sales': vp.innerHTML = renderSalesModule(); break;
          case 'purchase': vp.innerHTML = renderPurchaseModule(); break;
          case 'inventory': vp.innerHTML = renderInventoryModule(false); break;
          case 'warehouse': vp.innerHTML = renderInventoryModule(true); break;
          case 'manufacturing': vp.innerHTML = renderManufacturingModule(); break;
          case 'assets': vp.innerHTML = renderAssetsModule(); break;
          case 'hr': vp.innerHTML = renderHRModule(); break;
          case 'tax': vp.innerHTML = renderTaxModule(); break;
          case 'crm': vp.innerHTML = renderSimpleListModule('crm'); break;
          case 'projects': vp.innerHTML = renderSimpleListModule('projects'); break;
          case 'budgeting': vp.innerHTML = renderSimpleListModule('budgeting'); break;
          case 'documents': vp.innerHTML = renderSimpleListModule('documents'); break;
          case 'reports': vp.innerHTML = renderSimpleListModule('reports'); break;
          case 'settings': vp.innerHTML = renderSettingsModule(); break;
          default: vp.innerHTML = renderDashboard();
        }
      } catch (err) {
        console.error('Render error:', err);
        vp.innerHTML = `<div class="glass-card"><h3 style="color:#FF5268;">Terjadi kesalahan tampilan</h3><p>${err.message}</p></div>`;
      }
    }

    // Immediate Bootstrap
    renderSidebar();
    renderCompanySelect();
    updateAutoBackupIndicator();
    renderView();
  </script>
</body>
</html>
